# AI Interview Platform Configuration
# 智能AI面试官平台配置

server:
  # HTTP 服务监听端口
  port: 8080

spring:
  application:
    # Spring 应用名（用于日志、监控、链路标识）
    name: ai-interview-platform

  # 启用虚拟线程 (Java 21+)
  # 显著提升 I/O 密集型场景的并发能力，特别适合 AI 调用和 SSE 长连接
  threads:
    virtual:
      enabled: true

  # PostgreSQL数据库配置
  datasource:
    # PostgreSQL JDBC 连接串（支持通过环境变量覆盖）
    url: jdbc:postgresql://${POSTGRES_HOST:192.168.72.135}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    # 数据库用户名
    username: ${POSTGRES_USER:root}
    # 数据库密码
    password: ${POSTGRES_PASSWORD:123456}
    # JDBC 驱动
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update #首次启动用 create，表创建成功后，改回 update
    # 是否打印 SQL 到日志
    show-sql: false
    properties:
      hibernate:
        # Hibernate 方言
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 是否格式化 SQL
        format_sql: true

  servlet:
    multipart:
      # 启用 multipart 上传
      enabled: true
      max-file-size: 50MB  # 支持知识库上传（简历限制在业务层检查）
      # 单次请求总上传大小上限
      max-request-size: 50MB
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          # Redis 服务地址
          address: "redis://${REDIS_HOST:192.168.72.135}:${REDIS_PORT:6379}"
          # Redis 密码
          password: ${REDIS_PASSWORD:123456}
          # Redis DB 索引
          database: 0
          # 最小空闲连接数
          connectionMinimumIdleSize: 10
          # 连接池最大连接数
          connectionPoolSize: 64
          # 订阅连接最小空闲数
          subscriptionConnectionMinimumIdleSize: 1
          # 订阅连接池大小
          subscriptionConnectionPoolSize: 50
  
  # Spring AI - 阿里云DashScope (OpenAI兼容模式)
  ai:
    openai:
      # OpenAI 兼容接口基地址
      base-url: https://api.deepseek.com/v1
      # API Key（建议仅使用环境变量注入）
      api-key: ${AI_BAILIAN_API_KEY}
      chat:
        options:
          # 对话模型名
          model: ${AI_MODEL:deepseek-chat}
          # 生成随机性，越低越稳定
          temperature: 0.2
      # Embedding模型配置 - 使用阿里云百炼 text-embedding-v4
      embedding:
        # 阿里云百炼兼容 OpenAI 接口，与聊天模型独立
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # 使用独立的阿里云百炼 API Key
        api-key: ${AI_EMBEDDING_API_KEY}
        options:
          # 向量模型名（必须与 dimensions 对齐）
          model: text-embedding-v4
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1  # 不重试，失败立即返回
      # 是否对 4xx 客户端错误进行重试
      on-client-errors: false
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        # 向量索引类型（HNSW 适合近似检索）
        index-type: HNSW
        # 向量距离度量类型
        distance-type: COSINE_DISTANCE
        dimensions: 1024  # text-embedding-v3实际生成的向量维度
        initialize-schema: true # 开发环境设置为 true，方便快速启动。生产环境设置为 false，手动管理数据库 schema，避免意外变更。
        remove-existing-vector-store-table: false  # 保留现有表和数据

# Application custom configuration
app:
  ai:
    # 结构化输出重试次数（用于 BeanOutputConverter 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    rag:
      rewrite:
        # 是否启用问题重写（短问题补全、歧义消解）
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
      search:
        # 短问题阈值（字符数）
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        # 短问题召回 TopK
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        # 中长度问题召回 TopK
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        # 长问题召回 TopK
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        # 短问题最小相似度阈值
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        # 默认最小相似度阈值
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
  interview:
    # 每个主问题最多追加追问次数
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      # 评估批次大小（越大吞吐越高但延迟可能升高）
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
  resume:
    # 简历临时文件目录
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      # PDF
      - application/pdf
      # DOC
      - application/msword
      # DOCX
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      # TXT
      - text/plain

 
  # S3 兼容存储（MinIO / RustFS 等）；endpoint 为 API 地址，MinIO 默认端口 9000
  storage:
    # 对象存储 API 地址（容器内可用 service name）
    endpoint: ${APP_STORAGE_ENDPOINT:http://192.168.72.135:9000}
    # 存储访问 key
    access-key: ${APP_STORAGE_ACCESS_KEY:root}
    # 存储访问 secret
    secret-key: ${APP_STORAGE_SECRET_KEY:12345678}
    # 默认 bucket 名称
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
  
  # CORS配置 - React前端
  cors:
    # 允许跨域来源，多个地址用逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:80}
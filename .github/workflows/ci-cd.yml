name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ${{ github.repository }}/app
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ============================================================
  # Job 1: 检测哪些模块发生变更
  # ============================================================
  changes-check:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  # ============================================================
  # Job 2: 后端构建 + 测试
  # ============================================================
  backend-build-test:
    needs: changes-check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (needs.changes-check.outputs.backend == 'true' ||
         needs.changes-check.outputs.frontend == 'true')) ||
      (github.event_name == 'pull_request' &&
        needs.changes-check.outputs.backend == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interview_guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: interview_guide
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          AI_BAILIAN_API_KEY: ${{ secrets.AI_BAILIAN_API_KEY || 'test-key' }}

      - name: Build JAR
        run: ./gradlew :app:bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: app/build/libs/*.jar
          retention-days: 1

  # ============================================================
  # Job 3: 前端构建
  # ============================================================
  frontend-build:
    needs: changes-check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (needs.changes-check.outputs.backend == 'true' ||
         needs.changes-check.outputs.frontend == 'true')) ||
      (github.event_name == 'pull_request' &&
        needs.changes-check.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ============================================================
  # Job 4-1: Docker 后端镜像构建 (仅 main 分支 push)
  # ============================================================
  docker-build-backend:
    needs: backend-build-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_APP }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 4-2: Docker 前端镜像构建 (仅 main 分支 push)
  # ============================================================
  docker-build-frontend:
    needs: frontend-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 5: 部署到生产服务器 (仅 main 分支 push)
  # ============================================================
  deploy:
    needs: [docker-build-backend, docker-build-frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (needs.docker-build-backend.result == 'success' ||
       needs.docker-build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_BACKEND: ${{ needs.docker-build-backend.result == 'success' }}
          DEPLOY_FRONTEND: ${{ needs.docker-build-frontend.result == 'success' }}
        run: |
          # 创建 SSH 密钥文件
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            ${DEPLOY_USER}@${DEPLOY_HOST} "
            set -e

            cd /opt/amz-agent-yunyu

            # 1. 备份环境变量文件（防止 git pull 覆盖）
            [ -f deploy/env.prod ] && cp deploy/env.prod /tmp/env.prod.bak || true

            # 2. 同步 compose 文件
            git pull origin main 2>/dev/null || git pull origin master

            # 3. 恢复环境变量文件
            [ -f /tmp/env.prod.bak ] && cp /tmp/env.prod.bak deploy/env.prod && rm /tmp/env.prod.bak || true
            [ -f deploy/env.prod ] || cp deploy/env.prod.example deploy/env.prod

            # 4. 登录容器仓库
            echo '${GHCR_TOKEN}' | docker login ${REGISTRY:-ghcr.io} -u ${GHCR_USER} --password-stdin

            # 5. 按需拉取新镜像并重启
            if [ \"${DEPLOY_BACKEND}\" = \"true\" ]; then
              docker compose -f docker-compose.yml \
                -f deploy/docker-compose.prod.yml \
                --env-file deploy/env.prod \
                pull app
              docker compose -f docker-compose.yml \
                -f deploy/docker-compose.prod.yml \
                --env-file deploy/env.prod \
                up -d --no-build --remove-orphans app
            fi
            if [ \"${DEPLOY_FRONTEND}\" = \"true\" ]; then
              docker compose -f docker-compose.yml \
                -f deploy/docker-compose.prod.yml \
                --env-file deploy/env.prod \
                pull frontend
              docker compose -f docker-compose.yml \
                -f deploy/docker-compose.prod.yml \
                --env-file deploy/env.prod \
                up -d --no-build --remove-orphans frontend
            fi

            # 7. 清理旧镜像
            docker image prune -af

            # 8. 验证服务健康（只验证后端）
            if [ \"${DEPLOY_BACKEND}\" = \"true\" ]; then
              sleep 5
              curl -sf http://localhost:8080/actuator/health && echo 'Backend healthy' || echo 'Backend health check failed'
            fi
          "

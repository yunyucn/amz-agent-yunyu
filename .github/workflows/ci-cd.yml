name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 检测哪些模块发生变更
  # ============================================================
  changes-check:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  # ============================================================
  # Job 2: 后端构建 + 测试
  # ============================================================
  backend-build-test:
    needs: changes-check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        needs.changes-check.outputs.backend == 'true') ||
      (github.event_name == 'pull_request' &&
        needs.changes-check.outputs.backend == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interview_guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: interview_guide
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          AI_BAILIAN_API_KEY: ${{ secrets.AI_BAILIAN_API_KEY || 'test-key' }}
          AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY || 'test-key' }}

      - name: Build JAR
        run: ./gradlew :app:bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: app/build/libs/*.jar
          retention-days: 1

  # ============================================================
  # Job 3: 前端构建
  # ============================================================
  frontend-build:
    needs: changes-check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        needs.changes-check.outputs.frontend == 'true') ||
      (github.event_name == 'pull_request' &&
        needs.changes-check.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ============================================================
  # Job 5: 部署到生产服务器 (仅 main 分支 push)
  # ============================================================
  deploy:
    needs: [backend-build-test, frontend-build]
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (needs.backend-build-test.result == 'success' ||
       needs.frontend-build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Download frontend dist
        if: needs.frontend-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Download backend JAR
        if: needs.backend-build-test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar

      - name: Deploy frontend (static files to nginx)
        if: needs.frontend-build.result == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend-dist/* "${DEPLOY_USER}@${DEPLOY_HOST}:/usr/share/nginx/html/"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "nginx -s reload"
          echo "前端部署完成"

      - name: Deploy backend (SCP JAR + local Docker build)
        if: needs.backend-build-test.result == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # SCP JAR 到服务器
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/amz-agent-yunyu/app/build/libs"
          scp -i ~/.ssh/deploy_key \
            backend-jar/*.jar "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/amz-agent-yunyu/app/build/libs/app.jar"

          # SCP Dockerfile 到服务器（确保使用最新的单阶段构建配置）
          scp -i ~/.ssh/deploy_key \
            app/Dockerfile "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/amz-agent-yunyu/app/Dockerfile"

          # SSH 构建并重启
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -e
            cd /opt/amz-agent-yunyu

            # 确保 env.prod 存在
            [ -f deploy/env.prod ] || cp deploy/env.prod.example deploy/env.prod

            # 使用预编译 JAR 构建 Docker 镜像（Dockerfile 已改为单阶段直接 COPY）
            # 构建耗时约 1 秒，无需拉取 GitHub 或重新编译源码
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/env.prod build app

            # 重启
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/env.prod up -d --no-build --remove-orphans app

            # 清理旧镜像
            docker image prune -af

            # 健康检查
            sleep 5
            curl -sf http://localhost:8080/actuator/health && echo 'Backend healthy' || echo 'Backend health check failed'
          "
          echo "后端部署完成"

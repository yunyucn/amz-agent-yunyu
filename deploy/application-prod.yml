# ============================================
# AI Interview Platform - Production Spring Profile
# 生产环境 Spring 配置覆盖
# ============================================
# 使用方式:
#   在 docker-compose 的 app 环境变量中添加:
#     SPRING_PROFILES_ACTIVE: prod
#   或在 docker-compose.prod.yml 中已预配置。
#
# 该文件会覆盖 application.yml 中的开发期默认值，
# 与生产环境的 DeepSeek API 对齐。
# ============================================

spring:
  ai:
    openai:
      # 生产环境使用 DeepSeek，去掉 /v1 后缀 (Spring AI 2.0 会自动添加 /v1/chat/completions)
      base-url: https://api.deepseek.com
      chat:
        options:
          # 生产模型
          model: deepseek-chat
    vectorstore:
      pgvector:
        # text-embedding-v4 输出的向量维度是 1024
        dimensions: 1024
        # 生产环境建议手动管理 schema
        initialize-schema: false
